# ============================================================
# Knowledge Bridge — Docker Compose
# ============================================================
# MySQL、MinIO、RAGFlow 等依赖已独立部署，地址配置在 .env 中
#
# 用法：
#   docker compose up -d --build
#   docker compose logs -f knowledge-bridge
# ============================================================

services:
  knowledge-bridge:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: knowledge-bridge
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - LOG_PATH=/app/logs
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
    volumes:
      - ./logs:/app/logs
    network_mode: host
