server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8111}
  error:
    include-message: never
spring:
  application:
    name: knowledge-bridge
  datasource:
    url: jdbc:mysql://${DB_HOST:host.docker.internal}:${DB_PORT:3306}/${DB_NAME:kb_bridge}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
  task:
    scheduling:
      pool:
        size: 2
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
bridge:
  service-token: ${BRIDGE_SERVICE_TOKEN}
  shared-secret: ${KB_SHARED_SECRET}
  notes-url: ${NOTES_URL:http://host.docker.internal:8311}
  notes-token: ${NOTES_SERVICE_TOKEN}
  vector-url: ${VECTOR_URL:http://host.docker.internal:8700}
  vector-token: ${VECTOR_SERVICE_TOKEN}
  minio-endpoint: ${MINIO_ENDPOINT}
  minio-access-key: ${MINIO_ACCESS_KEY}
  minio-secret-key: ${MINIO_SECRET_KEY}
  releases-bucket: ${RELEASES_BUCKET:knowledge-releases}
  llm-base-url: ${LLM_BASE_URL}
  llm-api-key: ${LLM_API_KEY}
  llm-model: ${LLM_MODEL}
  llm-timeout-seconds: ${LLM_TIMEOUT_SECONDS:180}
  search-max-sources: ${SEARCH_MAX_SOURCES:5}
  processing-concurrency: ${PROCESSING_CONCURRENCY:2}
  ingest-requests-per-minute: ${INGEST_REQUESTS_PER_MINUTE:30}
  query-requests-per-minute: ${QUERY_REQUESTS_PER_MINUTE:120}
  source-max-chars: ${SOURCE_MAX_CHARS:3000}
  context-max-chars: ${CONTEXT_MAX_CHARS:10000}
  query-rewrite-enabled: ${QUERY_REWRITE_ENABLED:true}
logging:
  level:
    root: ${LOG_LEVEL:INFO}
